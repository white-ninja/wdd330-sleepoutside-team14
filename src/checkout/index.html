<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout-page">
        <h1>Review &amp; Place Your Order</h1>
        <form id="checkout-form">
          <fieldset>
            <legend>Customer Information</legend>
            <label>
              First Name
              <input name="fname" type="text" autocomplete="given-name" required />
            </label>
            <label>
              Last Name
              <input name="lname" type="text" autocomplete="family-name" required />
            </label>
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>
            <label>
              Street Address
              <input name="street" type="text" autocomplete="street-address" required />
            </label>
            <label>
              City
              <input name="city" type="text" autocomplete="address-level2" required />
            </label>
            <label>
              State / Province / Region
              <input name="state" type="text" autocomplete="address-level1" required />
            </label>
            <label>
              Postal / ZIP Code
              <input
                name="zip"
                type="text"
                autocomplete="postal-code"
                required
              />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>
            <p class="payment-notice" role="note">
              This coursework checkout is a demo, not a secure payment processor.
              Do not enter real card or security-code details.
            </p>
            <label>
              Card Number
              <input
                name="cardNumber"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                pattern="[0-9]{13,19}"
                title="For a demo only, enter 13 to 19 test-card digits."
                required
              />
            </label>
            <label>
              Expiration Date
              <input
                name="expiration"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="MM/YY"
                pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                title="For a demo only, enter a test expiration date as MM/YY."
                required
              />
            </label>
            <label>
              Security Code
              <input
                name="code"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                pattern="[0-9]{3,4}"
                title="For a demo only, enter a 3- or 4-digit test security code."
                required
              />
            </label>
          </fieldset>

          <section class="order-summary" aria-labelledby="order-summary-heading">
            <h2 id="order-summary-heading">Order Summary</h2>
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Tax: <span id="tax">$0.00</span></p>
            <p>Shipping: <span id="shipping">$0.00</span></p>
            <p>Order Total: <span id="orderTotal">$0.00</span></p>
          </section>

          <button type="submit">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
