<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Shop</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="./js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="%BASE_URL%images/banner-sm.jpg"
          srcset="%BASE_URL%images/banner-sm.jpg 500w, %BASE_URL%images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="%BASE_URL%images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="product-categories" aria-labelledby="category-heading">
        <h2 id="category-heading">Shop by Category</h2>
        <ul class="category-list">
          <li>
            <a href="%BASE_URL%product_listing/index.html?category=tents">
              <img src="%BASE_URL%images/categories/tents.svg" alt="" />
              <span>Tents</span>
            </a>
          </li>
          <li>
            <a href="%BASE_URL%product_listing/index.html?category=backpacks">
              <img src="%BASE_URL%images/categories/backpacks.svg" alt="" />
              <span>Backpacks</span>
            </a>
          </li>
          <li>
            <a href="%BASE_URL%product_listing/index.html?category=sleeping-bags">
              <img src="%BASE_URL%images/categories/sleeping-bags.svg" alt="" />
              <span>Sleeping Bags</span>
            </a>
          </li>
          <li>
            <a href="%BASE_URL%product_listing/index.html?category=hammocks">
              <img src="%BASE_URL%images/categories/hammocks.svg" alt="" />
              <span>Hammocks</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
